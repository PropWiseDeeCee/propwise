<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare - PropWise India</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script defer src="app.js"></script>
</head>

<body onload="initPage(true)">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">PropWise India</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <span id="nav-right"></span>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="container">

    <h2 style="margin-bottom: 20px;">Compare Properties</h2>

    <div class="grid">

      <div class="card" style="margin-bottom:20px;">
  <label><strong>Select State</strong></label>

  <select id="state" style="margin-top:10px; padding:10px; width:100%;">
    <option value="KA">Karnataka</option>
    <option value="MH">Maharashtra</option>
    <option value="TN">Tamil Nadu</option>
    <option value="TS">Telangana</option>
    <option value="DL">Delhi</option>
  </select>
</div>

      <!-- Property A -->
      <div class="card">
        <h3>Property A</h3>
        <input id="aName" placeholder="Property name">
        <input id="aPrice" placeholder="Base price">
        <input id="aCharges" placeholder="Additional charges">
      </div>

      <!-- Property B -->
      <div class="card">
        <h3>Property B</h3>
        <input id="bName" placeholder="Property name">
        <input id="bPrice" placeholder="Base price">
        <input id="bCharges" placeholder="Additional charges">
      </div>

    </div>

    <button onclick="compareAdvanced()">Compare</button>
    <button onclick="save()">Save Comparison</button>

    <!-- RESULT -->
    <div id="resultCard" class="card result-card" style="display:none;">
      <div id="resultDetails"></div>
      <div id="emiResult" style="margin-top:15px;"></div>
    </div>

  </div>

</body>
</html>
