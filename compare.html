<!DOCTYPE html>
<html>
<head>
  <title>Compare</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="app.js"></script>
</head>

<body onload="initPage(true)">

<header class="navbar">
  <div class="nav-container">
    <div class="logo">PropWise India</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <span id="nav-right"></span>
    </div>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>Compare Properties</h2>

    <input id="aName" placeholder="Property A">
    <input id="aPrice" placeholder="A base price">
    <input id="aCharges" placeholder="A charges">

    <input id="bName" placeholder="Property B">
    <input id="bPrice" placeholder="B base price">
    <input id="bCharges" placeholder="B charges">

    <button onclick="compareAdvanced()">Compare</button>
    <button onclick="save()">Save</button>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <div id="resultDetails"></div>
    <div id="emiResult"></div>
  </div>

</div>

</body>
</html>
