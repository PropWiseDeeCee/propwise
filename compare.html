<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare - PropWise India</title>
  <!-- AdSense -->
  <script async 
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8642420002721791"
    crossorigin="anonymous">
  </script>
  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script defer src="app.js"></script>
</head>

<body onload="initPage(false)">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">PropWise India</div>

      <div class="nav-links">
         <a href="index.html">Home</a>
      <a href="compare.html">Compare</a>
      <a href="tools.html">Tools</a>
      <a href="calculator.html">Calculator</a>
      <a href="guides.html">Guides</a>
      <a href="dashboard.html">Dashboard</a>
        <span id="nav-right"></span>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="container">

    <h2 style="margin-bottom: 20px;">Compare Properties</h2>

    <!-- STATE -->
    <div class="card" style="margin-bottom:20px;">
      <label><strong>Select State</strong></label>

      <select id="state" style="margin-top:10px; padding:10px; width:100%;">
        <option value="KA">Karnataka</option>
        <option value="MH">Maharashtra</option>
        <option value="TN">Tamil Nadu</option>
        <option value="TS">Telangana</option>
        <option value="DL">Delhi</option>
      </select>
    </div>

    <!-- GRID -->
    <div class="grid">

      <!-- Property A -->
      <div class="card">
        <h3>Property A</h3>

        <input id="aName" placeholder="Property name">

        <label style="margin-top:10px; display:block;">
          <strong>Property Type</strong>
        </label>
        <select id="aType" style="margin-top:8px; padding:10px; width:100%;">
          <option value="apartment">Apartment</option>
          <option value="villa">Villa</option>
          <option value="plot">Plot</option>
        </select>

        <input id="aPrice" placeholder="Base price">
        <input id="aCharges" placeholder="Additional charges">
      </div>

      <!-- Property B -->
      <div class="card">
        <h3>Property B</h3>

        <input id="bName" placeholder="Property name">

        <label style="margin-top:10px; display:block;">
          <strong>Property Type</strong>
        </label>
        <select id="bType" style="margin-top:8px; padding:10px; width:100%;">
          <option value="apartment">Apartment</option>
          <option value="villa">Villa</option>
          <option value="plot">Plot</option>
        </select>

        <input id="bPrice" placeholder="Base price">
        <input id="bCharges" placeholder="Additional charges">
      </div>

    </div>

    <!-- ACTION BUTTONS -->
    <button onclick="compareAdvanced()">Compare</button>
    <button onclick="save()">Save Comparison</button>

    <!-- RESULT -->
    <div id="resultCard" class="card" style="display:none; margin-top:20px;">
      <div id="resultDetails"></div>
      <div id="emiResult" style="margin-top:15px;"></div>
    </div>

  </div>

</body>
<div style="text-align:center; margin-top:40px; font-size:13px; color:#6b7280;">
  <a href="about.html">About</a> |
  <a href="privacy.html">Privacy Policy</a> |
  <a href="terms.html">Terms & Conditions</a>
</div>
</html>
