<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compare - PropWise India</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="app.js"></script>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">PropWise India</div>
    <div class="nav-links">
      <a href="calculator.html">Calculator</a>
      <a href="compare.html">Compare</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="guides.html">Guides</a>
      <a href="login.html">Login</a>
    </div>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>Compare Properties</h2>

    <input id="aName" placeholder="Property A name">
    <input id="aBase" placeholder="A price">
    <input id="aCharges" placeholder="A additional charges">

    <input id="bName" placeholder="Property B name">
    <input id="bBase" placeholder="B price">
    <input id="bCharges" placeholder="B additional charges">

    <button class="btn-primary" onclick="compareProperties()">Compare</button>
    <button class="btn-secondary" onclick="saveComparison()">Save Comparison</button>

    <div id="compareResult" class="result-box"></div>
  </div>
</div>

</body>
</html>
