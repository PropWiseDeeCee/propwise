<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compare Properties - PropWise India</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script defer src="app.js"></script>
</head>

<body onload="initPage(false)">

<!-- NAVBAR -->
<header class="navbar">
  <div id="navbar"></div>
</header>

<!-- CONTENT -->
<div class="container">

  <!-- HEADER -->
  <div style="text-align:center; margin-bottom:30px;">
    <h1>Compare Properties</h1>
    <p style="color:#6b7280;">
      Compare real total cost including hidden charges
    </p>
  </div>

  <!-- INPUT GRID -->
  <div class="grid">

    <!-- PROPERTY A -->
    <div class="card">
      <h3>Property A</h3>

      <input id="aName" placeholder="Property Name">

      <input id="aPrice" type="number" placeholder="Base Price">

      <input id="aCharges" type="number" placeholder="Additional Charges">
    </div>

    <!-- PROPERTY B -->
    <div class="card">
      <h3>Property B</h3>

      <input id="bName" placeholder="Property Name">

      <input id="bPrice" type="number" placeholder="Base Price">

      <input id="bCharges" type="number" placeholder="Additional Charges">
    </div>

  </div>

  <!-- ACTIONS -->
  <div style="text-align:center; margin-top:30px;">
    <button onclick="compareAdvanced()">
      Compare Now
    </button>

    <button onclick="save()" 
      style="background:#e5e7eb; color:#111827; margin-left:10px;">
      Save Comparison
    </button>
  </div>

  <!-- RESULT -->
  <div id="resultCard" class="card" style="margin-top:30px; display:none;">
    <h3>Comparison Result</h3>

    <div id="resultDetails"></div>
  </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

</body>
</html>
