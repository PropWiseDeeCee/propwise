<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compare Property Costs India | PropWise India</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script defer src="app.js"></script>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Property Compare Ability",
  "url": "https://propwise-zeta.vercel.app/compare.html",
  "applicationCategory": "FinanceApplication"
}
</script>
<!-- Open Graph -->
<meta property="og:type" content="website" />

<meta
  property="og:title"
  content="Compare Property Costs India | PropWise India"
/>

<meta
  property="og:description"
  content="Compare total property ownership costs including registration, GST, maintenance and hidden builder charges."
/>

<meta
  property="og:url"
  content="https://propwise-zeta.vercel.app/compare.html"
/>

<meta
  property="og:image"
  content="https://propwise-zeta.vercel.app/assets/og-compare.jpg"
/>

<meta
  property="og:site_name"
  content="PropWise India"
/>

<!-- Twitter -->
<meta
  name="twitter:card"
  content="summary_large_image"
/>

<meta
  name="twitter:title"
  content="Compare Property Costs India | PropWise India"
/>

<meta
  name="twitter:description"
  content="Compare apartments, villas and property purchase costs before buying."
/>

<meta
  name="twitter:image"
  content="https://propwise-zeta.vercel.app/assets/og-compare.jpg"
/>
</head>

<body onload="initPage(false)">

<!-- NAVBAR -->
<header class="navbar">
  <div id="navbar"></div>
</header>

<!-- CONTENT -->
<div class="container">

  <!-- HEADER -->
  <div style="text-align:center; margin-bottom:30px;">
    <h1>Compare Properties</h1>
    <p style="color:#6b7280;">
      Compare real total cost including hidden charges
    </p>
  </div>

  <!-- INPUT GRID -->
  <div class="grid">

    <!-- PROPERTY A -->
    <div class="card">
      <h3>Property A</h3>

      <input id="aName" placeholder="Property Name">

      <input id="aPrice" type="number" placeholder="Base Price">

      <input id="aCharges" type="number" placeholder="Additional Charges">
    </div>

    <!-- PROPERTY B -->
    <div class="card">
      <h3>Property B</h3>

      <input id="bName" placeholder="Property Name">

      <input id="bPrice" type="number" placeholder="Base Price">

      <input id="bCharges" type="number" placeholder="Additional Charges">
    </div>

  </div>

  <!-- ACTIONS -->
  <div style="text-align:center; margin-top:30px;">
    <button onclick="compareAdvanced()">
      Compare Now
    </button>

    <button onclick="save()" 
      style="background:#e5e7eb; color:#111827; margin-left:10px;">
      Save Comparison
    </button>
  </div>

  <!-- RESULT -->
  <div id="resultCard" class="card" style="margin-top:30px; display:none;">
    <h3>Comparison Result</h3>

    <div id="resultDetails"></div>
  </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

</body>
</html>
