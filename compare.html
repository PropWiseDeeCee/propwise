<!DOCTYPE html>
<html>
<head>
  <title>Compare</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body onload="initPage(true)">

<header class="navbar">
  <div class="nav-container">
    <div class="logo">PropWise India</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <span id="nav-right"></span>
    </div>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>Compare</h2>

    <input id="aName" placeholder="Property A">
    <input id="aPrice" placeholder="A price">
    <input id="aCharges" placeholder="A charges">

    <input id="bName" placeholder="Property B">
    <input id="bPrice" placeholder="B price">
    <input id="bCharges" placeholder="B charges">

    <button onclick="compare()">Compare</button>
    <button onclick="save()">Save</button>

    <div id="result"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
