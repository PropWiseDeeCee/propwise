<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | PropWise India</title>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Create a PropWise India account to save property comparisons and agreement analysis reports."
  >

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/core/reset.css">
  <link rel="stylesheet" href="css/core/typography.css">
  <link rel="stylesheet" href="css/core/layout.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/components/navbar.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/forms.css">
  <link rel="stylesheet" href="css/components/loaders.css">
  <link rel="stylesheet" href="css/components/dropdowns.css">
  <link rel="stylesheet" href="css/features/auth.css">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/path.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script src="js/core/component-loader.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/dropdowns.js"></script>
  <script src="js/core/analytics.js"></script>
  <script src="js/features/auth/auth-ui.js"></script>
  <script defer src="js/core/bootstrap.js"></script>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/favicon.png">
</head>

<body>
  <div id="navbar"></div>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="signupTitle">
      <div class="auth-header">
        <div class="auth-icon" aria-hidden="true">
          PW
        </div>
        <h1 id="signupTitle" class="auth-title">
          Create Account
        </h1>
        <p class="auth-subtitle">
          Save reports, comparisons, and property checks in one place.
        </p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="fullName">
            Full Name
          </label>
          <input
            id="fullName"
            class="form-input"
            type="text"
            autocomplete="name"
            placeholder="Your name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            Email
          </label>
          <input
            id="email"
            class="form-input"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password
          </label>
          <input
            id="password"
            class="form-input"
            type="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            minlength="6"
            required
          >
        </div>

        <button
          id="signupBtn"
          class="btn btn-primary btn-block"
          type="submit"
        >
          Create Account
        </button>

        <div
          id="authError"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

      <p class="auth-legal">
        By creating an account, you agree to our
        <a href="terms.html">Terms</a> and
        <a href="privacy.html">Privacy Policy</a>.
      </p>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
