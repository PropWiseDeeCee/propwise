<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - PropWise India</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/core/variables.css">
<link rel="stylesheet" href="css/core/reset.css">
<link rel="stylesheet" href="css/core/typography.css">
<link rel="stylesheet" href="css/core/layout.css">
<link rel="stylesheet" href="css/components/buttons.css">
<link rel="stylesheet" href="css/components/cards.css">
<link rel="stylesheet" href="css/components/navbar.css">
<link rel="stylesheet" href="css/components/footer.css">
<link rel="stylesheet" href="css/components/forms.css">
<link rel="stylesheet" href="css/components/loaders.css">
<link rel="stylesheet" href="css/components/dropdowns.css">
<link rel="stylesheet" href="css/features/auth.css">

<link rel="stylesheet" href="styles.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script src="js/core/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/component-loader.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/features/auth/auth-ui.js"></script>
  <script defer src="app.js"></script>
   <!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="shortcut icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/favicon.png">
</head>

<body onload="initPage(false)">

<!-- NAVBAR -->
<header class="navbar">
  <div id="navbar"></div>
</header>

<!-- CONTENT -->
<div class="container">

  <div class="card" style="max-width:420px; margin:auto; text-align:center;">

    <!-- HEADER -->
    <h2>Welcome back</h2>
    <p style="color:#6b7280; font-size:14px;">
      Login to access your reports and saved data
    </p>

    <!-- EMAIL -->
    <input id="email" type="email" placeholder="Enter your email">

    <!-- PASSWORD -->
    <input id="password" type="password" placeholder="Enter your password">

    <!-- LOGIN -->
    <button onclick="handleLogin()" id="loginBtn">
      Login
    </button>

    <!-- SIGNUP -->
    <button onclick="handleSignup()" 
      style="background:#e5e7eb; color:#111827;">
      Create Account
    </button>

    <!-- ERROR / SUCCESS -->
    <div id="authError" style="margin-top:12px; font-size:13px;"></div>

    <!-- TRUST -->
    <p style="font-size:12px; color:#6b7280; margin-top:15px;">
      Secure login • No spam • Quick access
    </p>

    <!-- LEGAL -->
    <p style="font-size:12px; color:#6b7280; margin-top:10px;">
      By continuing, you agree to our 
      <a href="terms.html">Terms</a> & 
      <a href="privacy.html">Privacy Policy</a>
    </p>

  </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

</body>
</html>
