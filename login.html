    content="Login to PropWise India to access saved property reports, comparisons, and agreement analysis history."
  >

  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/core/reset.css">
  <link rel="stylesheet" href="css/core/typography.css">
  <link rel="stylesheet" href="css/core/layout.css">

  <link rel="stylesheet" href="css/components/forms.css">
  <link rel="stylesheet" href="css/components/loaders.css">

  <link rel="stylesheet" href="css/features/auth.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/components/toast.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/core/dom.js"></script>

<body>
  <div id="navbar"></div>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="auth-header">
        <div class="auth-icon" aria-hidden="true">
          PW
        </div>
        <h1 id="loginTitle" class="auth-title">
          Welcome Back
        </h1>
        <p class="auth-subtitle">
          Login to access your reports and saved data.
        </p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email">
            Email
          </label>
          <input
            id="email"
            class="form-input"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password
          </label>
          <input
            id="password"
            class="form-input"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button
          id="loginBtn"
          class="btn btn-primary btn-block"
          type="submit"
        >
          Login
        </button>

        <div
          id="authError"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <p class="auth-switch">
        New to PropWise?
        <a href="signup.html">Create an account</a>
      </p>

      <p class="auth-legal">
        By continuing, you agree to our
        <a href="terms.html">Terms</a> and
        <a href="privacy.html">Privacy Policy</a>.
      </p>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
