<!-- NAVBAR -->
<header class="navbar">

<!-- CONTENT -->
<div class="container">

  <!-- HEADER -->
  <div style="text-align:center; margin-bottom:30px;">
    <h1>Property Cost Calculator</h1>
    <p style="color:#6b7280;">
      Estimate registration charges and total property cost
    </p>
  </div>

  <div class="card">

    <!-- STATE -->
    <label><strong>Select State</strong></label>
    <select id="state" style="margin-top:8px;">
      <option value="KA">Karnataka</option>
      <option value="MH">Maharashtra</option>
      <option value="TN">Tamil Nadu</option>
      <option value="TS">Telangana</option>
      <option value="DL">Delhi</option>
    </select>

    <!-- INPUTS -->
    <input id="basePrice" placeholder="Base price (₹)">
    <input id="chargesInput" placeholder="Additional charges (₹)">

    <!-- BUTTON -->
    <button onclick="calculate()">Calculate</button>

    <!-- RESULT -->
    <div id="calcResult" style="margin-top:20px;"></div>

  </div>

</div>
