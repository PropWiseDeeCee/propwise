   <script src="js/core/config.js"></script>

 <!-- Favicon -->

<body onload="initPage(false)">

<!-- NAVBAR -->
<header class="navbar">
  <div id="navbar"></div>
</header>

<!-- CONTENT -->
<div class="container">

  <!-- HEADER -->
  <div style="text-align:center; margin-bottom:30px;">
    <h1>Property Cost Calculator</h1>
    <p style="color:#6b7280;">
      Estimate total cost including registration and additional charges
    </p>
  </div>

  <!-- CALCULATOR CARD -->
  <div class="card" style="max-width:500px; margin:auto;">

    <!-- BASE PRICE -->
    <label><strong>Base Property Price (₹)</strong></label>
    <input id="basePrice" type="number" placeholder="e.g. 5000000">

    <!-- ADDITIONAL CHARGES -->
    <label style="margin-top:15px;"><strong>Additional Charges (₹)</strong></label>
    <input id="chargesInput" type="number" placeholder="e.g. 300000">

    <!-- STATE -->
    <label style="margin-top:15px;"><strong>Select State</strong></label>
    <select id="state">
      <option value="KA">Karnataka</option>
      <option value="MH">Maharashtra</option>
      <option value="TN">Tamil Nadu</option>
      <option value="DL">Delhi</option>
    </select>

    <!-- ACTION -->
    <button onclick="calculate()" style="margin-top:20px;">
      Calculate Total Cost
    </button>

    <!-- RESULT -->
    <div id="calcResult" style="margin-top:20px;"></div>

  </div>

  <!-- INFO SECTION -->
  <div style="margin-top:30px; text-align:center; font-size:13px; color:#6b7280;">
    ✔ Includes registration estimate  
    ✔ Based on typical state rates  
    ✔ Final costs may vary  
  </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

</body>
</html>
