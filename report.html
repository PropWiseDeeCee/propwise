  <link rel="icon" type="image/png" href="/assets/favicon.png">

<body data-page="report">


  <!-- NAVBAR -->
  <div id="navbar"></div>


  <!-- PAGE -->
  <div class="container">

    <div class="report-wrapper">


      <!-- HERO -->
      <div class="report-hero">

        <h1 class="report-title">
          Agreement Risk Report
        </h1>

        <p class="report-subtitle">

          AI-powered legal and financial
          agreement analysis for Indian
          property buyers.

        </p>

        <div class="report-meta">

          <div
            class="meta-pill"
            id="reportDate"
          >
            Loading...
          </div>

          <div
            class="meta-pill"
            id="reportName"
          >
            Agreement Report
          </div>

        </div>

      </div>


      <!-- REPORT CONTENT -->
      <div id="reportContent">

        <div class="card">

          Loading report...

        </div>

      </div>


      <!-- ACTIONS -->
      <div class="action-bar">

        <button
          onclick="downloadAgreementReport()"
        >
          Download PDF Report
        </button>

        <button
          class="secondary-btn"
          onclick="location.href='dashboard.html'"
        >
          Back to Dashboard
        </button>

        <button
          class="secondary-btn"
          onclick="location.href='tools.html'"
        >
          Analyze Another Agreement
        </button>

      </div>


      <!-- DISCLAIMER -->
      <div class="report-disclaimer">

        This is an AI-assisted analysis
        intended for informational purposes
        only and should not be considered
        legal advice.

      </div>

    </div>

  </div>


  <!-- FOOTER -->
  <div id="footer"></div>

  <div id="pdfRoot"></div>


  <!-- REPORT ENGINE -->
  <script>

    async function loadAgreementReport() {

      try {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const reportId =
          params.get("id");

        if (!reportId) {

          showErrorState(
            "Invalid report link"
          );

          return;
        }

        const user =
          await getUser();

        if (!user) {

          localStorage.setItem(
            "postLoginRedirect",
            window.location.pathname +
            window.location.search
          );

          window.location.href =
            appPath("login.html");

          return;
        }

        const supabase =
          window.getSupabaseClient();

        if (!supabase) {

          throw new Error(
            "Supabase unavailable"
          );
        }

        const { data, error } =
          await supabase

            .from("agreement_reports")

            .select("*")

            .eq("id", reportId)

            .eq("user_id", user.id)

            .single();

        if (error) {

          throw error;
        }

        if (!data) {

          throw new Error(
            "Report not found"
          );
        }

        document.getElementById(
          "reportDate"
        ).textContent =

          new Date(
            data.created_at
          ).toLocaleDateString(
            "en-IN",
            {
              day: "numeric",
              month: "short",
              year: "numeric"
            }
          );

        document.getElementById(
          "reportName"
        ).textContent =

          data.report_name ||
          "Agreement Report";

        const result =
          data.result || {};

        window.latestAnalyzerResult =
          result;

        renderReport(result);

      } catch (err) {

        console.error(err);

        showErrorState(
          "Failed to load report"
        );
      }
    }


    function renderReport(result) {

      const reportEl =
        document.getElementById(
          "reportContent"
        );

      const riskScore =
        result.risk_score || 0;

      const riskLevel =
        result.risk_level || "Medium";

      const critical =
        result.critical || [];

      const moderate =
        result.moderate || [];

      const recommendations =
        result.recommendations || [];


      reportEl.innerHTML = `

        <div class="score-card">

          <div class="
            score-circle
            ${riskLevel.toLowerCase()}
          ">

            ${riskScore}/100

          </div>

          <div class="risk-label">

            ${riskLevel} Risk

          </div>

          <p class="score-summary">

            This agreement contains
            ${riskLevel.toLowerCase()}
            legal and financial risks
            based on clause clarity,
            compliance indicators,
            payment structure,
            and buyer protection analysis.

          </p>

        </div>


        <div class="report-section">

          <h2>
            Critical Risks
          </h2>

          ${
            critical.length

            ? critical.map(item => `

              <div class="
                risk-item critical
              ">

                <div class="risk-icon">
                  ⚠
                </div>

                <div>
                  ${item}
                </div>

              </div>

            `).join("")

            : `

              <p>
                No critical risks detected.
              </p>
            `
          }

        </div>


        <div class="report-section">

          <h2>
            Moderate Risks
          </h2>

          ${
            moderate.length

            ? moderate.map(item => `

              <div class="
                risk-item moderate
              ">

                <div class="risk-icon">
                  ⚠
                </div>

                <div>
                  ${item}
                </div>

              </div>

            `).join("")

            : `

              <p>
                No moderate risks detected.
              </p>
            `
          }

        </div>


        <div class="report-section">

          <h2>
            Recommendations
          </h2>

          ${
            recommendations.length

            ? recommendations.map(item => `

              <div class="
                recommendation-item
              ">

                <div class="
                  recommendation-check
                ">
                  ✓
                </div>

                <div>
                  ${item}
                </div>

              </div>

            `).join("")

            : `

              <p>
                No recommendations available.
              </p>
            `
          }

        </div>
      `;
    }


    function showErrorState(message) {

      document.getElementById(
        "reportContent"
      ).innerHTML = `

        <div class="empty-state">

          <h2>
            ${message}
          </h2>

        </div>
      `;
    }


    document.addEventListener(
      "DOMContentLoaded",
      () => {

        loadAgreementReport();
      }
    );

  </script>

</body>

</html>
